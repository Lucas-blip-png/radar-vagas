spring:
  application:
    name: radar-vagas
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/radar;AUTO_SERVER=TRUE}
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

radar:
  # GitHub repositories whose open issues are job posts (Brazilian community boards)
  github-repos: backend-br/vagas
  # Optional: raises the GitHub API limit from 60 to 5000 requests/hour
  github-token: ${GITHUB_TOKEN:}
  remotive-search: java
  collect-interval: 6h
  initial-delay: 30s
  min-score: 30
  follow-up-days: 7
  profile:
    name: Lucas Daniel Duarte Cabral
    email: lucasdanielfaculdade@gmail.com
    github: https://github.com/Lucas-blip-png
    linkedin: https://www.linkedin.com/in/lucasdanielcabral
    pitch: >-
      Sou estudante de Análise e Desenvolvimento de Sistemas na UCDB e desenvolvo back-end
      com Java 21 e Spring Boot, com foco em testes automatizados, concorrência, mensageria
      (RabbitMQ) e Docker.
    projects:
      - "Mesa Pronta: bot de Discord em Spring Boot com lembretes via RabbitMQ (retry e DLQ) e testes com Testcontainers — https://github.com/Lucas-blip-png/mesa-pronta"
      - "ASUS RPG Platform: plataforma full-stack com API REST, WebSocket e JWT — https://github.com/Lucas-blip-png/Asus-site"
